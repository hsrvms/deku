root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/deku ./cmd/deku/"
  entrypoint = ["./tmp/deku"]
  include_ext = ["go", "mod", "sum"]
  exclude_dir = ["tmp", "vendor", ".git"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"